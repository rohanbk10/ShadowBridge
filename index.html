<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShadowBridge</title>
  <style>
    html, body { margin: 0; overflow: hidden; background: #fff; }
    #defaultCanvas0 { position: fixed; top: 0; left: 0; z-index: 1; }

    #qr-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #qr-tl, #qr-tr, #qr-bl, #qr-br {
      position: absolute;
      width: 80px;
      height: 80px;
      background: #fff;
      border: 2px solid #cc0000;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #qr-tl { top: 20px; left: 20px; }
    #qr-tr { top: 20px; right: 20px; }
    #qr-bl { bottom: 20px; left: 20px; }
    #qr-br { bottom: 20px; right: 20px; }
    .dimmed { opacity: 0.35; transition: opacity 0.3s; }

    #ui-overlay {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    #calibration-status {
      position: absolute; top: 16px; left: 50%;
      transform: translateX(-50%);
      color: #111; font: 600 15px/1.4 monospace;
      background: rgba(255,255,255,0.9); padding: 6px 14px;
      border: 1px solid #ccc; border-radius: 6px; pointer-events: none;
    }
    #btn-recalibrate {
      position: absolute; top: 116px; left: 20px;
      pointer-events: auto;
    }
    #win-overlay {
      position: absolute; inset: 0;
      flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: auto;
      background: rgba(0,0,0,0.6);
      color: #fff;
    }
    #win-overlay:not([hidden]) { display: flex; }
    #win-overlay[hidden] { display: none !important; }
    #win-overlay h1 { font: 700 48px/1 sans-serif; margin-bottom: 24px; }
    #btn-play-again { font-size: 18px; padding: 10px 28px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="qr-overlay">
    <div id="qr-tl"></div>
    <div id="qr-tr"></div>
    <div id="qr-bl"></div>
    <div id="qr-br"></div>
  </div>
  <div id="ui-overlay">
    <div id="calibration-status"></div>
    <button id="btn-recalibrate" hidden>Recalibrate</button>
    <div id="win-overlay" hidden>
      <h1>Level Won</h1>
      <button id="btn-play-again">Play Again</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://unpkg.com/perspective-transform@1.1.3/dist/perspective-transform.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const ids   = ['qr-tl', 'qr-tr', 'qr-bl', 'qr-br'];
      const texts = ['SHADOW_TL', 'SHADOW_TR', 'SHADOW_BL', 'SHADOW_BR'];
      ids.forEach((id, i) => {
        new QRCode(id, { text: texts[i], width: 76, height: 76,
          colorDark: '#cc0000', colorLight: '#ffffff' });
      });
    });
  </script>
  <script src="sketch.js"></script>
</body>
</html>
